version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: epam-dial-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - epam-dial
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/bash
    command: -lc "sleep 10 && ollama pull llama3:8b && ollama pull phi3 && echo 'Models ready'"
    networks:
      - epam-dial

  dial-core:
    image: ghcr.io/epam/ai-dial-core:latest
    container_name: epam-dial-core
    ports:
      - "8080:8080"
    environment:
      DIAL_HOST: 0.0.0.0
      DIAL_PORT: "8080"
    volumes:
      - ./docker/dial/config.yaml:/etc/ai-dial/config.yaml:ro
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks:
      - epam-dial

  api:
    build:
      context: ./app
    container_name: epam-dial-api
    ports:
      - "8000:8000"
    environment:
      OPENAI_BASE_URL: http://dial-core:8080/v1
      OPENAI_API_KEY: dial-demo-key
      FAST_MODEL: llama3
      REASONING_MODEL: phi3
      LOG_LEVEL: INFO
    depends_on:
      dial-core:
        condition: service_started
    networks:
      - epam-dial

  ui:
    build:
      context: ./ui
    container_name: epam-dial-ui
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_DIAL_BASE_URL: http://localhost:8080/v1
    depends_on:
      api:
        condition: service_started
    networks:
      - epam-dial

volumes:
  ollama_data:

networks:
  epam-dial:
    driver: bridge
