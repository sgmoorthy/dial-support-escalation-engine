name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dial-support-api:${{ github.ref_name }}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dial-support-ui:${{ github.ref_name }}
